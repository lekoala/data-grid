<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>data-grid disclosure fixture</title>
  <!-- Absolute paths: this fixture is served by demo/server.js from the repo root. -->
  <link rel="stylesheet" href="/dist/data-grid.css" />
  <script type="module">
    import DataGrid, { ArrayDataSource } from "/dist/data-grid.js";

    const rows = () =>
      Array.from({ length: 5 }, (_, i) => ({
        id: i + 1,
        name: `Name ${i + 1}`,
        company: "Acme",
        email: `user${i + 1}@example.com`,
        city: `City ${i + 1}`,
      }));

    // Narrow on purpose: the responsive plugin hides the low priority columns,
    // which is what brings a disclosure control on screen in both grids.
    const columns = () => [
      { field: "name", title: "Name", width: 160, responsive: 0 },
      { field: "company", title: "Company", width: 160, responsive: 1 },
      { field: "email", title: "Email", width: 160, responsive: 2 },
      { field: "city", title: "City", width: 160, responsive: 3 },
    ];

    // Responsive alone: it owns the disclosure control.
    const responsiveGrid = new DataGrid({
      id: "disclosure-grid",
      columns: columns(),
      dataSource: new ArrayDataSource(rows()),
      responsive: true,
      selectable: true,
    });
    responsiveGrid.style.width = "380px";
    document.body.appendChild(responsiveGrid);
    window.grid = responsiveGrid;

    // Responsive + row details at their defaults: one shared control governs
    // both sections of the row.
    const detailsGrid = new DataGrid({
      id: "details-grid",
      columns: columns(),
      dataSource: new ArrayDataSource(rows()),
      responsive: true,
      selectable: true,
      rowDetails: ({ row }) => `Profile for ${row.name}`,
    });
    detailsGrid.style.width = "380px";
    document.body.appendChild(detailsGrid);
    window.detailsGrid = detailsGrid;
  </script>
</head>
<body></body>
</html>
