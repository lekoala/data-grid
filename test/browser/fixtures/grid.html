<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>data-grid browser fixture</title>
  <!-- Absolute paths: this fixture is served by demo/server.js from the repo root. -->
  <link rel="stylesheet" href="/dist/data-grid.css" />
  <script type="module">
    import DataGrid, { ArrayDataSource } from "/dist/data-grid.js";

    const companies = ["Acme", "Google", "Facebook"];
    const rows = Array.from({ length: 50 }, (_, i) => ({
      id: i + 1,
      name: `Name ${String(i + 1).padStart(2, "0")}`,
      age: 20 + (i % 30),
      company: companies[i % 3],
    }));

    const localGrid = new DataGrid({
      id: "local-grid",
      columns: [
        { field: "id", title: "ID", width: 60 },
        { field: "name", title: "Name" },
        { field: "age", title: "Age" },
        { field: "company", title: "Company", editable: true },
      ],
      dataSource: new ArrayDataSource(rows),
      sortable: true,
      filterable: true,
      selectable: true,
      actions: [
        { name: "edit", label: "Edit" },
        { name: "delete", label: "Delete", intent: "danger" },
      ],
      pageSizes: [10, 25],
    });
    localGrid.addEventListener("action", (ev) => {
      window.lastAction = ev.detail;
    });
    document.body.appendChild(localGrid);
    window.grid = localGrid;

    const serverGrid = new DataGrid({
      id: "server-grid",
      columns: [
        { field: "id", title: "#", width: 60 },
        { field: "first_name", title: "First Name" },
        { field: "last_name", title: "Last Name" },
        { field: "company", title: "Company" },
      ],
      src: "/api/users",
      sortable: true,
      filterable: true,
    });
    document.body.appendChild(serverGrid);
    window.sgrid = serverGrid;

    const errorGrid = new DataGrid({
      id: "error-grid",
      columns: [{ field: "name" }],
      src: "/api/errors",
    });
    document.body.appendChild(errorGrid);
    window.egrid = errorGrid;
  </script>
</head>
<body></body>
</html>
