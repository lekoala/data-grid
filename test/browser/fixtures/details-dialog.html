<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>data-grid details dialog fixture</title>
  <!-- Absolute paths: this fixture is served by demo/server.js from the repo root. -->
  <link rel="stylesheet" href="/dist/data-grid.css" />
  <script type="module">
    import DataGrid, { ArrayDataSource } from "/dist/data-grid.js";

    const rows = () =>
      Array.from({ length: 8 }, (_, i) => ({
        id: i + 1,
        name: `Name ${i + 1}`,
        company: "Acme",
        email: `user${i + 1}@example.com`,
        city: `City ${i + 1}`,
      }));

    const columns = () => [
      { field: "name", title: "Name", width: 160, responsive: 0 },
      { field: "company", title: "Company", width: 160, responsive: 1 },
      { field: "email", title: "Email", width: 160, responsive: 2 },
      { field: "city", title: "City", width: 160, responsive: 3, hidden: true },
    ];

    window.events = [];
    const listen = (grid) =>
      grid.addEventListener("rowDetailsToggle", (event) => {
        window.events.push({ rowKey: event.detail.rowKey, expanded: event.detail.expanded });
      });

    // Built-in sheet only: responsive values are reachable in the dialog.
    const sheetGrid = new DataGrid({
      id: "sheet-grid",
      columns: columns(),
      dataSource: new ArrayDataSource(rows()),
      responsive: true,
      detailsDisplay: "dialog",
      rowLabel: "name",
    });
    sheetGrid.style.width = "380px";
    document.body.appendChild(sheetGrid);
    listen(sheetGrid);
    window.sheetGrid = sheetGrid;

    // Sheet + application content, with a body rerender in between.
    const appGrid = new DataGrid({
      id: "app-grid",
      columns: columns(),
      dataSource: new ArrayDataSource(rows()),
      detailsDisplay: "dialog",
      rowLabel: "name",
      rowDetails: ({ row }) => {
        const activity = document.createElement("p");
        activity.className = "activity";
        activity.textContent = `Activity for ${row.name}`;
        return activity;
      },
    });
    appGrid.style.width = "380px";
    document.body.appendChild(appGrid);
    listen(appGrid);
    window.appGrid = appGrid;
  </script>
</head>
<body></body>
</html>
