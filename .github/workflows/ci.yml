name: CI

on:
  push:
    branches: [master, 3-dev]
  pull_request:
    branches: [master, 3-dev]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run typecheck
      - run: bun run test
      - run: bun run check:locales
      - run: bun run types
      - run: bun run manifest
      - run: bun run build
      - name: Generated files are up to date
        run: git diff --exit-code -- dist custom-elements.json
      - name: Package is publishable
        run: npm pack --dry-run
      - name: Package contents contract
        run: bun run check:package

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Check system Chrome
        run: |
          command -v google-chrome
          google-chrome --version
      - run: bun run build
      - name: Smoke Bun.WebView
        run: |
          bun -e '
            await using view = new Bun.WebView({
              backend: {
                type: "chrome",
                url: false,
                stderr: "inherit",
              },
            });
            await view.navigate("about:blank");
            console.log(await view.evaluate("navigator.userAgent"));
          '
      - name: Browser tests (Chrome)
        run: bun run test:browser

  browser-webkit:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Browser tests (WKWebView)
        run: bun run test:browser
