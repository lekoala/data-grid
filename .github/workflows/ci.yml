name: CI

on:
  push:
    branches: [master, 3-dev]
  pull_request:
    branches: [master, 3-dev]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run ci
      - name: Package is publishable
        run: npm pack --dry-run
      - name: Package contents contract
        run: bun run check:package

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          install-dependencies: true
      - name: Check Chrome
        run: ${{ steps.chrome.outputs.chrome-path }} --version
      - run: bun run build
      - name: Browser tests (Chrome)
        env:
          BUN_CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: bun run test:browser

  browser-webkit:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Browser tests (WKWebView)
        run: bun run test:browser
