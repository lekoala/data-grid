<!DOCTYPE html>
<html lang="en" class="no-js" data-bs-theme="light">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Data Grid — Bootstrap 5 theme</title>

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>▦</text></svg>" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/last-icon@2/last-icon.css" />
    <link rel="stylesheet" href="../../dist/data-grid.css" />
    <link rel="stylesheet" href="../../themes/bootstrap.css" />
    <link rel="stylesheet" href="../demo.css" />

    <script type="module" src="https://cdn.jsdelivr.net/npm/last-icon@2/last-icon.js"></script>
    <script type="module">
      import { ArrayDataSource, DataGrid } from "../../data-grid.js";

      const data = await (await fetch("../demo-simple.json")).json();
      const grid = new DataGrid({
        columns: data.options.columns,
        dataSource: new ArrayDataSource(data.data),
        selectable: true,
        filterable: true,
        sortable: true,
        initialQuery: { pageSize: 10 },
      });
      document.getElementById("bootstrap-demo").replaceChildren(grid);

      document.getElementById("theme-toggle").addEventListener("click", () => {
        const docEl = document.documentElement;
        docEl.dataset.bsTheme = docEl.dataset.bsTheme === "dark" ? "light" : "dark";
      });
    </script>
  </head>

  <body>
    <header>
      <h1>Data Grid</h1>
      <p><em>Bootstrap 5 theme integration</em></p>
    </header>
    <main>
      <p>
        DataGrid inside a Bootstrap 5 environment. The theme maps DataGrid design
        tokens to Bootstrap variables; toggle <code>data-bs-theme</code> for dark mode.
      </p>

      <div class="demo-grid">
        <button id="theme-toggle" class="demo-button">Toggle dark mode</button>
        <div id="bootstrap-demo"></div>
      </div>
    </main>
    <footer>
      <hr />
      Made with <l-i name="heart" set="em"></l-i> in <l-i name="be" set="fl"></l-i> by <a href="https://www.lekoala.be">LeKoala</a>
    </footer>
  </body>
</html>
